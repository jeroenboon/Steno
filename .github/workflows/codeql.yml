name: CodeQL

# Static analysis (SAST) for the TypeScript across main, preload, renderer and
# shared. Runs on every PR to master, on push to master, and weekly to catch
# newly published query patterns against unchanged code. Findings surface in the
# repo's Security tab; this workflow is advisory and does not gate merges.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '27 4 * * 1' # Mondays 04:27 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          # Pure static analysis of the source; no build step needed and no
          # native ABI swap to worry about.
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: '/language:javascript-typescript'
